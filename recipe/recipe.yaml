schema_version: 1

context:
  name: amazon-textract-textractor
  version: "1.10.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # 1.10.0 was published to PyPI as a wheel only, so build from the GitHub tag
  url: https://github.com/aws-samples/amazon-textract-textractor/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b85afe0cdbc40c6b5b74b6be372729207721e47fb272211d9edc6b50a963dd0a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - textractor = textractor.cli.cli:textractor_cli

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - amazon-textract-caller >=0.2.4,<1
    - pillow
    - tabulate >=0.9,<0.10
    - xlsxwriter >=3.0,<4
    - rapidfuzz >=3.9.6,<4
    # imported by the `textractor` entry point (textractor/cli/cli.py) but not
    # listed in upstream requirements.txt
    - pyyaml

tests:
  - python:
      imports:
        - textractor
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - textractor --help

about:
  summary: A package to use AWS Textract services.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/aws-samples/amazon-textract-textractor

extra:
  recipe-maintainers:
    - StevenSchaererQC
